# The checks every push and pull request must pass (T4): the code (types, lint, design tokens, unit tests of the web
# app, the shared package and the phone site), the backend (pytest on PostgreSQL), the web app built (with its bundle
# budget) and driven end to end by Playwright against the fake Scene provider (apps/web/tests/support/fake-v1.mjs), the
# phone site built for the smoke test's /m/, the smoke test (against the same fake provider), the agent's evals in replay
# (recorded answers: free, never the real Claude), the order check of two test files, and the audits (pip-audit,
# npm audit, a secret scan). scripts/gate.ps1 and gate.sh run the same on a PC.
# Nothing here reaches a real provider or anyone's data: every studio is started on a database of its own.

name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24'
  PYTHON_VERSION: '3.14'
  # The tests' own account (docs/database.md): CREATEDB, so each test studio makes a throwaway database beside it.
  SCENE_TEST_DATABASE_URL: postgresql://scene_test:ci-only@localhost:5432/scene_test
  # The test studios' ports (docs/ports.md): smoke base+81/+90/+99, Playwright base+181/+190/+199.
  SCENE_TEST_PORT_BASE: '8100'

jobs:
  code:
    name: Types, lint, tokens, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - name: Design tokens made from tokens.json
        run: npm run tokens:check
      - name: Unit tests (web, shared, phone)
        run: npm test

  backend:
    name: Backend tests (PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: ci-superuser
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: "The tests' account and database (not a superuser: the row-level policies must apply to it)"
        run: |
          PGPASSWORD=ci-superuser psql -h localhost -U postgres -c "CREATE ROLE scene_test LOGIN CREATEDB PASSWORD 'ci-only'"
          PGPASSWORD=ci-superuser psql -h localhost -U postgres -c "CREATE DATABASE scene_test OWNER scene_test"
      - name: Python packages
        run: |
          python -m venv .venv
          .venv/bin/pip install -r backend/requirements-dev.txt
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: motion/package-lock.json
      - name: HyperFrames and ffmpeg (the motion graphics tests render; without them they are skipped)
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
          npm ci --prefix motion
      - name: pytest, with coverage
        working-directory: backend
        run: ../.venv/bin/python -m pytest -q -p no:cacheprovider --cov=scene --cov=evals --cov-report=term:skip-covered
      - name: Two test files in the order that once failed (one file's tests never depend on another's)
        working-directory: backend
        run: ../.venv/bin/python -m pytest -q -p no:cacheprovider tests/test_claude_sdk.py tests/test_claude.py
      - name: The agent's evals, replayed (recorded answers through the studio's real checks and pricing; never live here)
        working-directory: backend
        run: ../.venv/bin/python -m evals.run --json evals-results.json
      - name: What the evals found
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evals-results
          path: backend/evals-results.json
          if-no-files-found: ignore
          retention-days: 7
      - name: scripts/check_models.py (here it can only show that it runs; there is no Claude Code on the runner)
        run: .venv/bin/python scripts/check_models.py

  web:
    name: Build, bundle budget, Playwright, smoke
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: ci-superuser
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: The tests' account and database
        run: |
          PGPASSWORD=ci-superuser psql -h localhost -U postgres -c "CREATE ROLE scene_test LOGIN CREATEDB PASSWORD 'ci-only'"
          PGPASSWORD=ci-superuser psql -h localhost -U postgres -c "CREATE DATABASE scene_test OWNER scene_test"
      - name: Python packages (the test studios run this tree's backend from .venv)
        run: |
          python -m venv .venv
          .venv/bin/pip install -r backend/requirements.txt
      - run: npm ci
      - name: Build the web app (fails when the studio's first-load JavaScript grows past its budget)
        run: npm run build -w apps/web
      - name: Playwright's browser
        working-directory: apps/web
        run: npx playwright install --with-deps chromium
      - name: Playwright, against the fake Scene provider
        working-directory: apps/web
        run: npx playwright test
      - name: The phone site, built (the smoke test opens /m/)
        run: npm run build -w apps/mobile
      - name: Smoke test, against the fake Scene provider
        run: node apps/web/tests/smoke/smoke.mjs
      - name: What Playwright saw when a test failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: apps/web/test-results/
          retention-days: 7

  audit:
    name: Audits (report)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the secret scan reads the history too
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: pip-audit of the backend's packages (a report; a known vulnerability is listed in the summary)
        continue-on-error: true
        run: |
          python -m pip install --quiet pip-audit
          pip-audit -r backend/requirements.txt --progress-spinner off --desc | tee pip-audit.txt
          { echo '### pip-audit'; echo '```'; cat pip-audit.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: npm audit of what the apps ship (fails on high or critical; moderate and low are reported)
        run: |
          npm ci --ignore-scripts
          npm audit --omit=dev --audit-level=high | tee npm-audit.txt
          { echo '### npm audit --omit=dev'; echo '```'; tail -40 npm-audit.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Secret scan of the tree and its history (gitleaks; what it finds is shown redacted)
        # a report until its first run is clean (allow-list the tests' made-up keys in .gitleaks.toml), then blocking
        continue-on-error: true
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.18.4 detect --source /repo --redact --no-banner --verbose
