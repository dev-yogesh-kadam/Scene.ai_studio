<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />

    <title>Scene.ai</title>
    <meta name="description" content="Your Scene.ai studio on your phone." />
    <!-- Added to the home screen, it opens full screen like an app. -->
    <link rel="manifest" href="/m/manifest.json" />

    <meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)" />

    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Scene.ai" />
    <link rel="apple-touch-icon" href="/m/icons/apple-touch-icon.png" />
    <!-- A file, not a <style> here: the studio's policy allows no inline style. -->
    <link rel="stylesheet" href="/m/reset.css" />
  </head>

    <noscript>Scene.ai needs JavaScript. Or open the <a href="/?desktop=1">full studio</a>.</noscript>
