# For writing a new migration from backend/ (docs/database.md):
#     ..\.venv\Scripts\alembic.exe revision -m "what it does"
# Run migrations with scripts/migrate.py, not with this file: it knows the database and the app's account.
[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .
file_template = %%(rev)s_%%(slug)s
truncate_slug_length = 40
